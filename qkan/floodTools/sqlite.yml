# Wasserspiegel wlevel
floodtools_info_wlevel: "
PRAGMA table_list('wlevel');"

floodtools_create_wlevel1: "
CREATE TABLE IF NOT EXISTS wlevel (
    pk INTEGER PRIMARY KEY,
    h REAL,
    tanf TEXT,
    tend TEXT);"

floodtools_create_wlevel2: "
SELECT AddGeometryColumn('wlevel','geom', ?, 'MULTIPOLYGON',2);"

floodtools_create_wlevel3: "
SELECT CreateSpatialIndex('wlevel','geom');"

floodtools_delete_wlevel: "
DELETE FROM wlevel;"

# Max. Wasserspiegel wlevelMax
floodtools_create_wlevelmax1: "
CREATE TABLE IF NOT EXISTS wlevelmax (
pk INTEGER PRIMARY KEY,
hmax REAL);"

floodtools_create_wlevelmax2: "
SELECT AddGeometryColumn('wlevelmax','geom', ?,'MULTIPOLYGON',2)"

floodtools_create_wlevelmax3: "
SELECT CreateSpatialIndex('wlevelmax','geom')"

floodtools_delete_wlevelmax: "
DELETE FROM wlevelmax"

# Fliessgeschwindigketi velo
floodtools_info_velo: "
PRAGMA table_list('velo');"

floodtools_create_velo1: "
  CREATE TABLE IF NOT EXISTS velo (
    pk INTEGER PRIMARY KEY,
    v REAL,
    angle REAL,
    tanf TEXT,
    tend TEXT);"

floodtools_create_velo2: "
  SELECT AddGeometryColumn('velo','geom', ?,'POINT',2);"

floodtools_create_velo3: "
  SELECT CreateSpatialIndex('velo','geom');"

floodtools_delete_velo: "
  DELETE FROM velo;"

# Max. Fliessgeschwindigkeit
floodtools_create_velomax1: "
CREATE TABLE IF NOT EXISTS velomax (
pk INTEGER PRIMARY KEY,
vmax REAL);"

floodtools_create_velomax2: "
SELECT AddGeometryColumn('velomax','geom', ?,'POINT',2);"

floodtools_create_velomax3: "
SELECT CreateSpatialIndex('velomax','geom');"

floodtools_delete_velomax: "
DELETE FROM velomax;"

floodtools_info_velo_v1: "
PRAGMA table_info('result2d__velocity');"

floodtools_info_velo_v2: "
PRAGMA table_info('velocity');"

floodtools_info_wlevel_v1: "
PRAGMA table_info('result2d__topo_decimated');"

floodtools_info_wlevel_v2: "
PRAGMA table_info('topo_decimated');"

floodtools_insert_wlevel: "
  INSERT INTO wlevel (h, tanf, tend, geom)
  VALUES (?, ?, ?, GeomFromWKB(?, ?));"

floodtools_insert_velo: "
  INSERT INTO velo (v, angle, tanf, tend, geom)
  VALUES (?, ?, ?, ?, GeomFromWKB(?, ?));"

